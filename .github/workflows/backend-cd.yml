name: Backend CD

on:
  push:
    branches:
      - main
    paths:
      - 'starter/backend/**'

  workflow_dispatch:

jobs:
  lint:
    name: Backend Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        working-directory: starter/backend
        run: |
          python -m pip install --upgrade pip
          pip install flask==2.2.3 flask-cors==3.0.10 pytest flake8 werkzeug==2.2.3

      - name: Run lint
        working-directory: starter/backend
        run: flake8

  test:
    name: Backend Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        working-directory: starter/backend
        run: |
          python -m pip install --upgrade pip
          pip install flask==2.2.3 flask-cors==3.0.10 pytest werkzeug==2.2.3

      - name: Run tests
        working-directory: starter/backend
        run: pytest -v

  build:
    name: Build and Deploy Backend
    needs:
      - lint
      - test

    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1
      ECR_REPOSITORY: 814945016581.dkr.ecr.us-east-1.amazonaws.com/backend
      EKS_CLUSTER_NAME: cluster

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        working-directory: starter/backend
        run: |
          docker build \
            --tag $ECR_REPOSITORY:${{ github.sha }} \
            .

      - name: Push Docker image
        run: |
          docker push $ECR_REPOSITORY:${{ github.sha }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER_NAME

      - name: Deploy backend to Kubernetes
        working-directory: starter/backend/k8s
        run: |
          kustomize edit set image backend=$ECR_REPOSITORY:${{ github.sha }}
          kustomize build | kubectl apply -f -

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/backend --timeout=180s
          kubectl get pods
          kubectl get services